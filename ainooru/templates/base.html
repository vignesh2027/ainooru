<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t("title") }}</title>
<meta name="description" content="Forecast your Tamil Nadu electricity cycle and stay under the 500-unit cliff.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v={{ css_v }}">
</head>
<body>
<header class="top"><div class="wrap">
  <img src="/static/logo.svg" alt="">
  <div class="brand">{{ t("brand") }} <small>{{ t("brand_sub") }}</small></div>
  <div class="spacer"></div>
  <span class="pill hide-narrow">{{ t("pill") }}</span>
  <a class="switch" href="/lang/{{ 'ta' if lang == 'en' else 'en' }}" lang="{{ 'ta' if lang == 'en' else 'en' }}">{{ t("switch") }}</a>
</div></header>
<main><div class="wrap">
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</div></main>
<footer><div class="wrap">
  {{ t("footer") }} {{ t("tariff_source") }} {{ tariff.source }}
</div></footer>
</body>
</html>
